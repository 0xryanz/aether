name: aether-forge

services:
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-56}
        NEXT_PUBLIC_AETHER_ADDRESS: ${NEXT_PUBLIC_AETHER_ADDRESS:-}
        NEXT_PUBLIC_RELIC_ADDRESS: ${NEXT_PUBLIC_RELIC_ADDRESS:-}
        NEXT_PUBLIC_LOOM_ADDRESS: ${NEXT_PUBLIC_LOOM_ADDRESS:-}
        NEXT_PUBLIC_FORGE_ADDRESS: ${NEXT_PUBLIC_FORGE_ADDRESS:-}
        NEXT_PUBLIC_MARKET_ADDRESS: ${NEXT_PUBLIC_MARKET_ADDRESS:-}
        NEXT_PUBLIC_REGISTRY_ADDRESS: ${NEXT_PUBLIC_REGISTRY_ADDRESS:-}
        NEXT_PUBLIC_USDT_ADDRESS: ${NEXT_PUBLIC_USDT_ADDRESS:-}
        NEXT_PUBLIC_USDT_DECIMALS: ${NEXT_PUBLIC_USDT_DECIMALS:-18}
        NEXT_PUBLIC_DEPLOY_BLOCK: ${NEXT_PUBLIC_DEPLOY_BLOCK:-0}
        NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-}
        NEXT_PUBLIC_DEMO_FAUCET: ${NEXT_PUBLIC_DEMO_FAUCET:-0}
        NEXT_PUBLIC_SELF_REGISTER: ${NEXT_PUBLIC_SELF_REGISTER:-0}
    image: aether-forge-web:latest
    container_name: aether-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  nginx:
    build:
      context: ./deploy/nginx
    image: aether-forge-nginx:latest
    container_name: aether-nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.prod}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/certs:/etc/nginx/certs
      - ./deploy/www:/var/www/certbot
      - nginx_cache:/var/cache/nginx/static
    networks:
      - edge
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  acme:
    image: neilpang/acme.sh:latest
    container_name: aether-acme
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_started
    entrypoint: ["/bin/sh", "/opt/acme/run.sh"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_STAGING: ${ACME_STAGING:-0}
      ACME_FORCE: ${ACME_FORCE:-0}
    volumes:
      - ./deploy/acme:/opt/acme:ro
      - acme_home:/acme
      - ./deploy/certs:/certs
      - ./deploy/www:/var/www/certbot
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    driver: bridge

volumes:
  nginx_cache:
  acme_home:
