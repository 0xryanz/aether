# ---------------------------------------------------------------------------
# Nginx edge for Aether Forge
# ---------------------------------------------------------------------------
user  nginx;
worker_processes  auto;
worker_rlimit_nofile  65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  8192;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    server_tokens off;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    types_hash_max_size 4096;

    keepalive_timeout   65;
    keepalive_requests  1000;
    client_max_body_size 2m;
    client_body_timeout  15s;
    client_header_timeout 15s;
    send_timeout         30s;
    reset_timedout_connection on;

    # Efficient static file lookups.
    open_file_cache          max=10000 inactive=30s;
    open_file_cache_valid    60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # Real client IP when running behind another LB/Cloudflare.
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time '
                    'uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;

    # Compression (Next.js compression is disabled in next.config.ts).
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        application/rss+xml
        application/manifest+json
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    # Brotli is not compiled into the stock image. If you build nginx with
    # ngx_brotli, enable:
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript image/svg+xml;

    # Upstream keepalive to the Next.js standalone server.
    upstream next_upstream {
        server web:3000;
        keepalive 64;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    proxy_buffers      16 16k;
    proxy_buffer_size  16k;
    proxy_busy_buffers_size 32k;
    proxy_temp_file_write_size 64k;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Static asset cache shared by all vhosts.
    proxy_cache_path /var/cache/nginx/static
                     levels=1:2
                     keys_zone=static_cache:32m
                     max_size=2g
                     inactive=30d
                     use_temp_path=off;

    limit_req_zone  $binary_remote_addr zone=api_limit:10m rate=25r/s;
    limit_conn_zone $binary_remote_addr zone=per_ip:10m;

    include /etc/nginx/conf.d/*.conf;
}
